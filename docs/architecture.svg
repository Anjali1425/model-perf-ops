<svg width="100%" viewBox="0 0 760 760" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Model performance operations architecture</title>
<desc>A flow diagram showing a user query going through a RAG app, traced by Langfuse, sampled and scored by RAGAS, aggregated on a dashboard, checked in a weekly review, and when a threshold is breached, routed through an escalation runbook, a Promptfoo launch gate, and deployment, which loops back into the RAG app.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8D96A6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .bg { fill: #10131A; }
    .arr { stroke: #8D96A6; stroke-width: 1.5; fill: none; }
    .node-rect { stroke-width: 1; }
    .n-gray { fill: #1B1F28; stroke: #4A5160; }
    .n-blue { fill: #172238; stroke: #5B8DEF; }
    .n-violet { fill: #241E38; stroke: #9B8CF2; }
    .n-amber { fill: #2E2415; stroke: #E8A33D; }
    .th { font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif; font-size: 14px; font-weight: 600; fill: #E7EAEE; }
    .ts { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 12px; fill: #8D96A6; }
  </style>
</defs>

<rect class="bg" x="0" y="0" width="760" height="760" rx="16"/>

<line x1="200" y1="126" x2="200" y2="76" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-gray">
<rect x="110" y="20" width="180" height="56" rx="8"/>
</g>
<text class="th" x="200" y="42" text-anchor="middle">User Query</text>
<text class="ts" x="200" y="62" text-anchor="middle">a question comes in</text>

<line x1="200" y1="232" x2="200" y2="182" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-blue">
<rect x="100" y="126" width="200" height="56" rx="8"/>
</g>
<text class="th" x="200" y="148" text-anchor="middle">RAG App</text>
<text class="ts" x="200" y="168" text-anchor="middle">retrieval + Claude API</text>

<line x1="200" y1="338" x2="200" y2="288" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-blue">
<rect x="105" y="232" width="190" height="56" rx="8"/>
</g>
<text class="th" x="200" y="254" text-anchor="middle">Langfuse</text>
<text class="ts" x="200" y="274" text-anchor="middle">cost, latency, tokens</text>

<line x1="295" y1="260" x2="330" y2="260" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-violet">
<rect x="330" y="232" width="160" height="56" rx="8"/>
</g>
<text class="th" x="410" y="254" text-anchor="middle">RAGAS</text>
<text class="ts" x="410" y="274" text-anchor="middle">scores quality</text>

<line x1="200" y1="444" x2="200" y2="394" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-blue">
<rect x="105" y="338" width="190" height="56" rx="8"/>
</g>
<text class="th" x="200" y="360" text-anchor="middle">Dashboard</text>
<text class="ts" x="200" y="380" text-anchor="middle">the aggregated view</text>

<g class="node-rect n-blue">
<rect x="100" y="444" width="200" height="56" rx="8"/>
</g>
<text class="th" x="200" y="466" text-anchor="middle">Weekly Review</text>
<text class="ts" x="200" y="486" text-anchor="middle">human checks the numbers</text>

<line x1="300" y1="472" x2="450" y2="472" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-amber">
<rect x="450" y="444" width="220" height="56" rx="8"/>
</g>
<text class="th" x="560" y="466" text-anchor="middle">Escalation Runbook</text>
<text class="ts" x="560" y="486" text-anchor="middle">triggered on threshold breach</text>

<line x1="560" y1="550" x2="560" y2="500" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-amber">
<rect x="460" y="550" width="200" height="56" rx="8"/>
</g>
<text class="th" x="560" y="572" text-anchor="middle">Promptfoo Gate</text>
<text class="ts" x="560" y="592" text-anchor="middle">tests fix before it ships</text>

<line x1="560" y1="656" x2="560" y2="606" class="arr" marker-end="url(#arrow)"/>
<g class="node-rect n-amber">
<rect x="470" y="656" width="180" height="56" rx="8"/>
</g>
<text class="th" x="560" y="678" text-anchor="middle">Deploy</text>
<text class="ts" x="560" y="698" text-anchor="middle">closes the loop</text>

<polyline points="650,684 720,684 720,154 300,154" class="arr" marker-end="url(#arrow)"/>
</svg>
